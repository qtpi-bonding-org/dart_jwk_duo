version: 3.0.0
homepage: https://github.com/yourusername/dart_jwk_duo
repository: https://github.com/yourusername/dart_jwk_duo

environment:
  sdk: ^3.11.0

dependencies:
  flutter_rust_bridge: 2.11.1
  hooks: ^1.0.0
  code_assets: ^1.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
