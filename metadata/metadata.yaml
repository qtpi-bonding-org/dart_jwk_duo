id: dart-jwk-duo
verified_at: 21dc14f
public:
  name: Dart JWK Duo
  summary: Dart package for a two-key P-256 JWK Set (ES256 signing, HPKE encryption) backed by Rust.
  status: active
  stage: beta
  stack:
  - Dart
  - Rust
  - flutter_rust_bridge
  links:
  - type: repo
    url: https://github.com/qtpi-bonding-org/dart_jwk_duo
private:
  started: 2025-12
  visibility: public
  license: MIT
  ownership: designed and directed; code written with AI assistance
  build: agentic
facts:
- id: key-types
  assertion: The package provides SigningKeyPair (ECDSA P-256, ES256), EncryptionKeyPair (P-256 HPKE, alg
    HPKE-7) and SymmetricKey (AES-256-GCM, 256-bit keys only).
  evidence:
  - lib/src/signing_key_pair.dart
  - lib/src/encryption_key_pair.dart
  - lib/src/symmetric_key.dart
  - lib/src/constants.dart
- id: jwk-set-import-export
  assertion: KeyDuoSerializer exports a two-key JWK Set (signing key first, encryption key second), with
    private members or public-only, and imports either form back. It rejects a 2.x set (alg ECDH-ES+A256KW).
  evidence:
  - lib/src/key_duo_serializer.dart
  - test/jwk_duo_test.dart
- id: sec1-public-key-encoding
  assertion: Public keys are exported and imported only as SEC1 uncompressed points (65 bytes, 130 lowercase
    hex characters). Any other length or a non-0x04 tag throws FormatException, and off-curve points are
    rejected only later by the native import.
  evidence:
  - lib/src/sec1_public_key.dart
  - test/sec1_parity_test.dart
- id: hpke-and-aes-gcm-with-aad
  assertion: CryptoService does single-shot HPKE encryption to a recipient's public key and AES-256-GCM
    encryption, each with optional info and aad bound into the ciphertext. Tampering, a wrong key, or wrong
    info or aad makes decrypt throw FormatException. The cryptography runs in the Rust bridge, not in Dart,
    and the HPKE wire-format vectors live in a sibling repo, not in this package's Dart tests.
  evidence:
  - lib/src/crypto_service.dart
  - test/crypto_wire_format_test.dart
- id: signing-and-encryption-keys-kept-apart
  assertion: The KeyDuo constructor throws ArgumentError if both public keys are byte-identical. The public-key
    import methods accept only distinct typed hex wrappers, which is a compile-time check only.
  evidence:
  - lib/src/key_duo.dart
  - test/errors_test.dart
  - test/public_key_hex_test.dart
- id: native-handles-and-dispose
  assertion: Key objects wrap native handles, so private scalars are not held as Dart values. dispose()
    releases the handle, and use after dispose throws StateError. SymmetricKey bytes stay native until toJwk()
    returns them as a Dart String.
  evidence:
  - lib/src/signing_key_pair.dart
  - lib/src/symmetric_key.dart
  - lib/src/errors.dart
  - test/init_test.dart
- id: service-layers
  assertion: The public API is split into GenerationService (creates keys), ValidationService (structural
    JWK format checks only) and VerificationService (cryptographic sign/verify and encrypt/decrypt roundtrips).
  evidence:
  - lib/src/generation_service.dart
  - lib/src/validation_service.dart
  - lib/src/verification_service.dart
  - test/validation_service_test.dart
- id: bridge-via-flutter-rust-bridge
  assertion: All 41 public functions of the Rust bridge crate carry the frb(sync) attribute. The Dart bindings
    are generated by flutter_rust_bridge 2.11.1 and committed, and the Rust crate pins rust_jwk_duo by git
    revision.
  evidence:
  - rust/src/api.rs
  - rust/Cargo.toml
  - flutter_rust_bridge.yaml
- id: native-library-load
  assertion: ensureInitialized() loads the native library once per process, and concurrent first calls
    share one load. The library path comes from the DART_JWK_DUO_NATIVE_LIB environment variable, then
    from the build hook output on macOS and Linux, then from flutter_rust_bridge's default loader on other
    platforms.
  evidence:
  - lib/src/init.dart
  - test/init_test.dart
- id: build-hook-cargo
  assertion: The Dart build hook compiles rust/ with cargo build --release per target for macOS, Linux,
    iOS and Android only. On other OSes it emits no asset, and it registers a bundled dynamic-loading CodeAsset.
    On Android it uses cargo ndk and fails if ANDROID_NDK_HOME is unset.
  evidence:
  - hook/build.dart
- id: platform-verification
  state: partial
  assertion: The hook targets macOS, Linux, iOS and Android. The CHANGELOG records testing on macOS, the
    iOS simulator only, an Android x86_64 emulator only, and Linux in Docker only; there are no physical-device
    or arm64 Android runs, and no Windows or web support.
  evidence:
  - hook/build.dart
  - CHANGELOG.md
  - tool/verify.sh
- id: conformance-tests-shared-vectors
  assertion: The conformance tests read shared vectors from a sibling ../rust_jwk_duo/conformance checkout
    or from the JWK_DUO_CONFORMANCE_DIR environment variable, so they cannot run without that checkout.
    lib/testing.dart exposes runConformance for other packages.
  evidence:
  - test/conformance_test.dart
  - lib/testing.dart
  - tool/verify.sh
