[package]
name = "dart_jwk_duo_bridge"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rust_jwk_duo = { git = "https://github.com/qtpi-bonding-org/rust_jwk_duo", rev = "489985d719539a6d8f841561728eb33cda82601e" }
flutter_rust_bridge = "=2.11.1"
serde_json = "1"
# Direct pin: libc 0.2.190 breaks `backtrace` on the iOS targets, so Cargo.lock must keep 0.2.180.
libc = "=0.2.180"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace]
